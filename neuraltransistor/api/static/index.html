<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>neuraltransistor</title>
<style>
  :root{
    --bg:#ffffff; --panel:#fafaf9; --fg:#18181b; --dim:#71717a; --faint:#a1a1aa;
    --line:#e7e5e4; --accent:#b45309; --accent-bg:#fef3c7;
    --ok:#15803d; --ok-bg:#f0fdf4; --ok-line:#bbf7d0; --no:#f4f4f5;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--mono);
       -webkit-font-smoothing:antialiased;font-size:13px;line-height:1.55}
  .wrap{max-width:820px;margin:0 auto;padding:52px 28px 72px}
  header{display:flex;align-items:baseline;justify-content:space-between;
         padding-bottom:16px;margin-bottom:28px;border-bottom:1px solid var(--line);
         flex-wrap:wrap;gap:10px}
  h1{font-size:16px;font-weight:600;margin:0;letter-spacing:-.01em}
  h1 span{color:var(--accent)}
  .meta{color:var(--faint);font-size:11px}
  nav{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:26px}
  nav button{font:inherit;font-size:11px;background:var(--bg);color:var(--dim);
    border:1px solid var(--line);border-radius:5px;padding:5px 11px;cursor:pointer;
    transition:.12s}
  nav button:hover{color:var(--fg);border-color:#d6d3d1;background:var(--panel)}
  nav button[aria-selected=true]{color:var(--accent);background:var(--accent-bg);
    border-color:#fcd34d;font-weight:500}
  .doc{color:var(--dim);font-size:11.5px;margin:-16px 0 30px;min-height:2.8em;
       max-width:64ch;line-height:1.6}
  .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:32px}
  .n{background:var(--panel);border:1px solid var(--line);border-radius:8px;
     padding:16px 18px}
  .n b{display:block;font-size:29px;font-weight:550;letter-spacing:-.03em;
       font-variant-numeric:tabular-nums;line-height:1.1}
  .n i{display:block;font-style:normal;color:var(--faint);font-size:9.5px;
       text-transform:uppercase;letter-spacing:.1em;margin-top:7px}
  .ctl{display:grid;grid-template-columns:82px 1fr 96px;align-items:center;
       gap:16px;margin-bottom:14px}
  .ctl label{color:var(--dim);font-size:11px}
  .ctl output{text-align:right;font-variant-numeric:tabular-nums;font-size:11.5px;
    color:var(--fg)}
  input[type=range]{-webkit-appearance:none;appearance:none;height:3px;
    background:var(--line);border-radius:3px;outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;
    height:13px;border-radius:50%;background:var(--accent);cursor:pointer;
    box-shadow:0 1px 3px rgba(0,0,0,.18)}
  input[type=range]::-moz-range-thumb{width:13px;height:13px;border:0;
    border-radius:50%;background:var(--accent);cursor:pointer}
  .sec{margin-top:30px;padding-top:22px;border-top:1px solid var(--line)}
  .sec h2{font-size:9.5px;text-transform:uppercase;letter-spacing:.11em;
    color:var(--faint);font-weight:500;margin:0 0 12px}
  .devs{display:flex;flex-wrap:wrap;gap:6px}
  .dev{font-size:10.5px;padding:4px 10px;border-radius:5px;border:1px solid var(--line);
       color:var(--faint);background:var(--no)}
  .dev.fit{color:var(--ok);border-color:var(--ok-line);background:var(--ok-bg)}
  .dev.gone{opacity:.5;text-decoration:line-through}
  footer{margin-top:26px;padding-top:18px;border-top:1px solid var(--line);
         color:var(--dim);font-size:11px;display:flex;gap:14px;flex-wrap:wrap}
  footer b{color:var(--fg);font-weight:550;font-variant-numeric:tabular-nums}
  footer i{font-style:normal;color:var(--line)}
  .err{color:#b91c1c}
  @media(max-width:580px){.nums{grid-template-columns:1fr}.n b{font-size:25px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>fly<span>forge</span></h1>
    <div class="meta" id="meta">loading…</div>
  </header>

  <nav id="tabs"></nav>
  <p class="doc" id="doc"></p>

  <div class="nums">
    <div class="n"><b id="v-neurons">—</b><i>neurons</i></div>
    <div class="n"><b id="v-edges">—</b><i>edges kept</i></div>
    <div class="n"><b id="v-kb">—</b><i>flash on device</i></div>
  </div>

  <div class="ctl">
    <label for="p">confidence</label>
    <input id="p" type="range" min="60" max="99" value="90" step="1">
    <output id="p-out">P(real) ≥ 0.90</output>
  </div>
  <div class="ctl">
    <label for="b">precision</label>
    <input id="b" type="range" min="0" max="2" value="0" step="1">
    <output id="b-out">int8</output>
  </div>

  <div class="sec">
    <h2>fits on</h2>
    <div class="devs" id="devs"></div>
  </div>

  <footer id="foot"></footer>
</div>

<script>
const BITS=[8,4,2], $=s=>document.querySelector(s);
let cur='compass', info=null, timer=null;
const fmt=n=>n.toLocaleString('en-US');

async function boot(){
  info=await (await fetch('/api/circuits')).json();
  $('#meta').textContent=`${info.dataset} · ${fmt(info.n_neurons)} neurons · ${fmt(info.n_edges)} edges`;
  $('#tabs').innerHTML=info.circuits.map(c=>
    `<button data-k="${c.key}" aria-selected="${c.key===cur}">${c.key}</button>`).join('');
  $('#tabs').onclick=e=>{const b=e.target.closest('button'); if(!b)return;
    cur=b.dataset.k; [...$('#tabs').children].forEach(x=>
      x.setAttribute('aria-selected', x.dataset.k===cur)); go();};
  ['#p','#b'].forEach(s=>$(s).addEventListener('input',()=>{labels();debounce();}));
  labels(); go();
}
function labels(){
  $('#p-out').textContent='P(real) ≥ '+(+$('#p').value/100).toFixed(2);
  $('#b-out').textContent='int'+BITS[+$('#b').value];
}
function debounce(){clearTimeout(timer); timer=setTimeout(go,180);}

async function go(){
  const p=(+$('#p').value/100), bits=BITS[+$('#b').value];
  const d=await (await fetch(`/api/compute?circuit=${cur}&p_real=${p}&bits=${bits}`)).json();
  if(d.error){ $('#foot').innerHTML=`<span class="err">${d.error}</span>`; return; }
  $('#doc').textContent=d.doc;
  $('#v-neurons').textContent=fmt(d.neurons);
  $('#v-edges').textContent=fmt(d.edges);
  $('#v-kb').textContent=(d.kb>=1024?(d.kb/1024).toFixed(1)+' MB':d.kb.toFixed(0)+' KB');
  $('#devs').innerHTML=d.devices.map(x=>
    `<span class="dev ${x.fits?'fit':''} ${x.available?'':'gone'}" title="${x.note} — ${x.flash_kb}KB flash / ${x.sram_kb}KB SRAM${x.mw?' — '+x.mw+' mW':''}">${x.name}</span>`).join('');
  $('#foot').innerHTML=[
    `<b>${d.min_weight}</b>+ syn`,
    `<b>${(d.edge_retention*100).toFixed(0)}%</b> edges`,
    `<b>${(d.synapse_retention*100).toFixed(0)}%</b> synapses`,
    `<b>${(d.drive_err*100).toFixed(2)}%</b> drive error`,
    `<b>${d.sign_flips}</b> sign flips`,
    `<b>${d.ram_kb.toFixed(0)} KB</b> RAM`,
  ].join('<i>·</i>');
}
boot();
</script>
</body>
</html>
