<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>flyforge</title>
<style>
  :root{
    --bg:#0b0c0e; --fg:#eceae7; --dim:#6a7077; --line:#1c1f23;
    --accent:#e0a458; --ok:#7dd3a0; --no:#2a2e33;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--mono);
       -webkit-font-smoothing:antialiased;font-size:13px;line-height:1.5}
  .wrap{max-width:760px;margin:0 auto;padding:48px 24px 64px}
  header{display:flex;align-items:baseline;justify-content:space-between;
         border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:26px;
         flex-wrap:wrap;gap:8px}
  h1{font-size:15px;font-weight:600;margin:0;letter-spacing:.02em}
  h1 span{color:var(--accent)}
  .meta{color:var(--dim);font-size:11px}
  nav{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:30px}
  nav button{font:inherit;font-size:11px;background:none;color:var(--dim);
    border:1px solid var(--line);border-radius:3px;padding:5px 10px;cursor:pointer;
    transition:.12s}
  nav button:hover{color:var(--fg);border-color:#2e3339}
  nav button[aria-selected=true]{color:var(--bg);background:var(--accent);
    border-color:var(--accent)}
  .doc{color:var(--dim);font-size:11px;margin:-18px 0 28px;min-height:2.6em;
       max-width:62ch}
  .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:34px}
  .n b{display:block;font-size:30px;font-weight:500;letter-spacing:-.02em;
       font-variant-numeric:tabular-nums}
  .n i{display:block;font-style:normal;color:var(--dim);font-size:10px;
       text-transform:uppercase;letter-spacing:.09em;margin-top:5px}
  .ctl{display:grid;grid-template-columns:88px 1fr 84px;align-items:center;
       gap:14px;margin-bottom:12px}
  .ctl label{color:var(--dim);font-size:11px}
  .ctl output{text-align:right;font-variant-numeric:tabular-nums;font-size:12px}
  input[type=range]{-webkit-appearance:none;appearance:none;height:2px;
    background:var(--line);border-radius:2px;outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;
    height:11px;border-radius:50%;background:var(--accent);cursor:pointer}
  input[type=range]::-moz-range-thumb{width:11px;height:11px;border:0;
    border-radius:50%;background:var(--accent);cursor:pointer}
  .devs{display:flex;flex-wrap:wrap;gap:6px;margin:30px 0 22px;
        border-top:1px solid var(--line);padding-top:24px}
  .dev{font-size:10.5px;padding:4px 9px;border-radius:3px;border:1px solid var(--no);
       color:var(--dim)}
  .dev.fit{color:var(--ok);border-color:#24382e;background:#101915}
  footer{border-top:1px solid var(--line);padding-top:16px;color:var(--dim);
         font-size:11px;display:flex;gap:18px;flex-wrap:wrap}
  footer b{color:var(--fg);font-weight:500}
  .err{color:#e07a5f}
  @media(max-width:560px){.nums{grid-template-columns:1fr 1fr}.n b{font-size:24px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>fly<span>forge</span></h1>
    <div class="meta" id="meta">loading…</div>
  </header>

  <nav id="tabs"></nav>
  <p class="doc" id="doc"></p>

  <div class="nums">
    <div class="n"><b id="v-neurons">—</b><i>neurons</i></div>
    <div class="n"><b id="v-edges">—</b><i>edges kept</i></div>
    <div class="n"><b id="v-kb">—</b><i>flash</i></div>
  </div>

  <div class="ctl">
    <label for="p">confidence</label>
    <input id="p" type="range" min="60" max="99" value="90" step="1">
    <output id="p-out">P(real) ≥ 0.90</output>
  </div>
  <div class="ctl">
    <label for="b">precision</label>
    <input id="b" type="range" min="0" max="2" value="0" step="1">
    <output id="b-out">int8</output>
  </div>

  <div class="devs" id="devs"></div>

  <footer id="foot"></footer>
</div>

<script>
const BITS=[8,4,2], $=s=>document.querySelector(s);
let cur='compass', info=null, timer=null;
const fmt=n=>n.toLocaleString('en-US');

async function boot(){
  info=await (await fetch('/api/circuits')).json();
  $('#meta').textContent=`${info.dataset} · ${fmt(info.n_neurons)} neurons · ${fmt(info.n_edges)} edges`;
  $('#tabs').innerHTML=info.circuits.map(c=>
    `<button data-k="${c.key}" aria-selected="${c.key===cur}">${c.key}</button>`).join('');
  $('#tabs').onclick=e=>{const b=e.target.closest('button'); if(!b)return;
    cur=b.dataset.k; [...$('#tabs').children].forEach(x=>
      x.setAttribute('aria-selected', x.dataset.k===cur)); go();};
  ['#p','#b'].forEach(s=>$(s).addEventListener('input',()=>{labels();debounce();}));
  labels(); go();
}
function labels(){
  $('#p-out').textContent='P(real) ≥ '+(+$('#p').value/100).toFixed(2);
  $('#b-out').textContent='int'+BITS[+$('#b').value];
}
function debounce(){clearTimeout(timer); timer=setTimeout(go,180);}

async function go(){
  const p=(+$('#p').value/100), bits=BITS[+$('#b').value];
  const r=await fetch(`/api/compute?circuit=${cur}&p_real=${p}&bits=${bits}`);
  const d=await r.json();
  if(d.error){ $('#foot').innerHTML=`<span class="err">${d.error}</span>`; return; }
  $('#doc').textContent=d.doc;
  $('#v-neurons').textContent=fmt(d.neurons);
  $('#v-edges').textContent=fmt(d.edges);
  $('#v-kb').textContent=(d.kb>=1024?(d.kb/1024).toFixed(1)+' MB':d.kb.toFixed(0)+' KB');
  $('#devs').innerHTML=d.devices.map(x=>
    `<span class="dev ${x.fits?'fit':''}" title="${x.note} — ${x.flash_kb}KB flash / ${x.sram_kb}KB SRAM">${x.name}</span>`).join('');
  $('#foot').innerHTML=[
    `weight ≥ <b>${d.min_weight}</b> syn`,
    `kept <b>${(d.edge_retention*100).toFixed(0)}%</b> edges / <b>${(d.synapse_retention*100).toFixed(0)}%</b> synapses`,
    `drive error <b>${(d.drive_err*100).toFixed(2)}%</b>`,
    `<b>${d.sign_flips}</b> sign flips`,
    `RAM <b>${d.ram_kb.toFixed(0)} KB</b>`,
  ].join('<span style="opacity:.4">·</span>');
}
boot();
</script>
</body>
</html>
