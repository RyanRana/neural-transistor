# generated by neuraltransistor -- cross-build and boot the emitted kernel.
#
# The `expect` string is the FNV-1a digest of 64 ticks of spikes, computed from
# the numpy reference at emit time. The console can only print it by computing the same
# spikes, so a green check means the int8 kernel is bit-exact on cross-compiled ARM --
# not merely that the firmware linked and reached main.
#
# flash_max / ram_max are nRF52840's datasheet capacity. The ELF is linked against the
# EMULATOR's map (see valence.ld); these gates are what check it would fit the real part.
targets:
  - id: valence/mps2-an385
    base: debian:bookworm-slim
    apt: [gcc-arm-none-eabi, qemu-system-arm]
    build: make -C firmware/valence
    validate: qemu_system
    machine: mps2-an385
    artifact: firmware/valence/valence.elf
    expect: "DIGEST ac6534d3eb3693a0"
    size_tool: arm-none-eabi-size
    flash_max: 1024K
    ram_max: 256K
    boot_timeout: 120
    artifacts: [firmware/valence/valence.elf]
