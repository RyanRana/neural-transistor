[project]
name = "neural-transistor"
version = "0.1.0"
description = "Neural Transistor - compile Drosophila connectome circuits into quantized controllers for real robots."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "pyarrow>=15",
  "scipy>=1.11",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6"]
fit = ["cma>=3.3"]
dev = ["pytest>=8.0"]

[project.scripts]
ntx = "neuraltransistor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["neuraltransistor"]
